{% extends "base.html" %}
{% block title %}历史记录 - 食品配料分析助手{% endblock %}

{% block content %}
<div class="history-page">
    <div class="container">
        <div class="page-header">
            <h1>📜 分析历史</h1>
            <p class="page-desc">查看你过去分析过的食品记录</p>
        </div>

        <div class="card">
            <div class="card-body">
                <div id="historyList">
                    <div class="loading-placeholder">
                        <div class="spinner"></div>
                        <p>加载中...</p>
                    </div>
                </div>
                <div class="pagination" id="pagination"></div>
            </div>
        </div>
    </div>
</div>

<!-- 删除确认弹窗 -->
<div class="modal-overlay" id="deleteModal" style="display:none;">
    <div class="modal-card">
        <h3>确认删除</h3>
        <p>确定要删除这条分析记录吗？此操作不可撤销。</p>
        <div class="modal-actions">
            <button class="btn btn-outline" onclick="closeDeleteModal()">取消</button>
            <button class="btn btn-danger" id="confirmDeleteBtn" onclick="confirmDelete()">确认删除</button>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
let currentPage = 1;
let deleteTargetId = null;

async function loadHistory(page = 1) {
    currentPage = page;
    const list = document.getElementById('historyList');
    list.innerHTML = '<div class="loading-placeholder"><div class="spinner"></div><p>加载中...</p></div>';

    const result = await apiRequest(`/api/scans?page=${page}&per_page=20`);
    if (!result || result.status !== 200) {
        list.innerHTML = '<p class="empty-text">加载失败，请重试</p>';
        return;
    }

    const data = result.data;
    if (data.scans.length === 0) {
        list.innerHTML = `
            <div class="empty-state">
                <div class="empty-icon">📭</div>
                <p>暂无分析记录</p>
                <a href="/dashboard" class="btn btn-primary">去分析食品 →</a>
            </div>
        `;
        document.getElementById('pagination').innerHTML = '';
        return;
    }

    const suitabilityMap = {
        'safe': '✅ 适合',
        'moderate': '🔶 一般',
        'caution': '⚠️ 谨慎',
        'not_recommended': '🚫 不建议',
    };

    let html = '<div class="history-list">';
    data.scans.forEach(scan => {
        const suitabilityText = suitabilityMap[scan.suitability] || scan.suitability;
        html += `
            <div class="history-item">
                <div class="history-main" onclick="window.location.href='/result/${scan.id}'">
                    <div class="history-info">
                        <h3 class="history-food-name">🍽️ ${escapeHtml(scan.food_name)}</h3>
                        <div class="history-meta">
                            <span class="history-time">${scan.created_at}</span>
                        </div>
                    </div>
                    <div class="history-stats">
                        <span class="history-badge badge-harmful">🔴 有害 ${scan.harmful_count || 0}</span>
                        <span class="history-badge badge-beneficial">🟢 有益 ${scan.beneficial_count || 0}</span>
                        <span class="history-badge badge-suitability">${suitabilityText}</span>
                    </div>
                </div>
                <button class="history-delete-btn" onclick="event.stopPropagation(); openDeleteModal(${scan.id})" title="删除记录">
                    🗑️
                </button>
            </div>
        `;
    });
    html += '</div>';
    list.innerHTML = html;

    // 分页
    let pagHtml = '';
    if (data.total_pages > 1) {
        pagHtml += '<div class="pagination-btns">';
        if (data.page > 1) {
            pagHtml += `<button class="btn btn-sm btn-outline" onclick="loadHistory(${data.page - 1})">上一页</button>`;
        }
        pagHtml += `<span class="pagination-info">第 ${data.page} / ${data.total_pages} 页（共 ${data.total} 条）</span>`;
        if (data.page < data.total_pages) {
            pagHtml += `<button class="btn btn-sm btn-outline" onclick="loadHistory(${data.page + 1})">下一页</button>`;
        }
        pagHtml += '</div>';
    }
    document.getElementById('pagination').innerHTML = pagHtml;
}

function openDeleteModal(scanId) {
    deleteTargetId = scanId;
    document.getElementById('deleteModal').style.display = 'flex';
}

function closeDeleteModal() {
    deleteTargetId = null;
    document.getElementById('deleteModal').style.display = 'none';
}

async function confirmDelete() {
    if (!deleteTargetId) return;
    const result = await apiRequest(`/api/scan/${deleteTargetId}`, { method: 'DELETE' });
    if (result && result.data.success) {
        showToast('记录已删除', 'success');
        closeDeleteModal();
        loadHistory(currentPage);
    } else {
        showToast('删除失败', 'error');
    }
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

loadHistory();
</script>
{% endblock %}
